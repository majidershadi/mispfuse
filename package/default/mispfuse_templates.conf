# MISPFuse mapping templates.
# Each stanza is a template selectable from the alert action / mispfusepush.
# Event-level keys set defaults; push-time options override them.
# Mapping lines (map.1, map.2, ...):
#   map.N = <source_field>:<type>:<category>:<to_ids>:<disable_correlation>[:<comment_field>]
# Leave <type> empty to let MISP pick from sane_defaults for a plain value.

[network_ioc]
grouping = single_event
event_info = Network IOCs from Splunk (MISPFuse)
distribution = 0
threat_level_id = 4
analysis = 0
publish = 0
to_ids = 1
tags = source:splunk
strict = 0
map.1 = src_ip:ip-src:Network activity:1:0
map.2 = dest_ip:ip-dst:Network activity:1:0
map.3 = domain:domain:Network activity:1:0
map.4 = url:url:Network activity:1:0
map.5 = dest_host:hostname:Network activity:1:0

[file_hashes]
grouping = single_event
event_info = File hashes from Splunk (MISPFuse)
distribution = 0
threat_level_id = 4
analysis = 0
publish = 0
to_ids = 1
tags = source:splunk
strict = 0
map.1 = md5:md5:Payload delivery:1:0
map.2 = sha1:sha1:Payload delivery:1:0
map.3 = sha256:sha256:Payload delivery:1:0
map.4 = file_name:filename:Payload delivery:0:0

[email_phishing]
grouping = single_event
event_info = Phishing indicators from Splunk (MISPFuse)
distribution = 0
threat_level_id = 3
analysis = 0
publish = 0
to_ids = 1
tags = source:splunk,tlp:amber
strict = 0
map.1 = src_email:email-src:Payload delivery:1:0
map.2 = dest_email:email-dst:Payload delivery:0:0
map.3 = subject:email-subject:Payload delivery:0:0
map.4 = url:url:Payload delivery:1:0

# Passthrough: map generic fields with no forced type; MISP infers a sane
# default category from the type. Edit to fit your own field names.
[passthrough]
grouping = per_row
event_info = Splunk export (MISPFuse)
distribution = 0
threat_level_id = 4
analysis = 0
publish = 0
to_ids = 0
strict = 0
map.1 = ioc_value:::0:0:comment
