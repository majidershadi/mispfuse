name: Feature request
description: Propose a current-release enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the operational problem, not only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and deployment impact
      description: Include credential, network, SHC, Cloud, and scale considerations.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
